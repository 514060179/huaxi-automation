[project]
name = "integration-harness"
version = "0.1.0"
description = "Real-environment normal-path integration harness for the Huaxia Accounting WeChat mini program"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "oss2>=2.18",
  "qrcode>=7.4",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["integration_harness*"]
