[project]
name = "wechat-login-harvester"
version = "0.1.0"
description = "UI automation and traffic capture harness for WeChat mini-program login token extraction"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "mitmproxy>=10.0",
  "oss2>=2.18",
  "pyobjc-framework-Cocoa>=11.0",
  "pyobjc-framework-Quartz>=11.0",
  "pyobjc-framework-Vision>=11.0",
  "websockets>=12",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["wechat_login_harvester*"]
